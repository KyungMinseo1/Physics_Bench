# Model card: https://huggingface.co/google/gemma-3-4b-it
# Greedy evaluation baseline; not a task-validated optimum. GPU/context settings are project defaults.
provider: vllm
model_path: google/gemma-3-4b-it
vllm:
  gpus_per_instance: 1
  n_instances: 1
  gpu_ids:
  - 0
  gpu_memory_utilization: 0.8
  max_model_len: 12000
  max_num_seqs: 1
  enable_sleep_mode: false
  enable_prefix_caching: true
  limit_mm_per_prompt:
    image: 8
sampling:
  temperature: 0.0
  max_tokens: 4096
  seed: 42
  n: 1
  top_p: 1.0
  top_k: -1
  repetition_penalty: 1.0
