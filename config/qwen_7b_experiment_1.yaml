# 학생 실험용 예시 설정입니다. 먼저 배정받은 GPU 번호를 아래 gpu_ids에 적으세요.
# 파일 이름의 7b는 실험 이름일 뿐입니다. 실제로 실행하는 모델은 아래의 2B 모델입니다.
# 7B 모델로 실험하려면 이미지 입력을 지원하는 모델을 골라 model_path를 바꿔야 합니다.
model_path: Qwen/Qwen3-VL-2B-Instruct  # 내려받을 모델 이름. 이미 저장되어 있으면 캐시를 사용합니다.

# 모델을 어느 GPU에서 실행할지, 한 번에 얼마나 처리할지 정합니다.
vllm:
  gpus_per_instance: 1  # 모델 한 벌을 실행하는 데 쓸 GPU 수. 2라면 두 GPU에 모델을 나눠 올립니다.
  n_instances: 1       # 같은 모델을 몇 벌 실행할지. 처음에는 1로 두세요.
  gpu_ids: [0]         # 배정받은 GPU 번호로 바꾸세요. 예: GPU 3번을 받았다면 [3]
  # GPU 번호는 gpus_per_instance × n_instances개를 적으세요.
  # 예: 위 두 값이 각각 1, 2이면 [0, 1]의 두 GPU에 모델을 한 벌씩 올립니다.
  gpu_memory_utilization: 0.8  # 각 GPU의 전체 메모리 중 약 80%를 사용하는 기준입니다.
  # 남은 메모리의 80%라는 뜻이 아닙니다. 다른 실험의 사용량도 확인하세요.
  max_model_len: 12000  # 문제·이미지·안내문과 답변을 합쳐 허용할 최대 길이(토큰 수)
  # 토큰은 글자 수와 다른 길이 단위입니다. 이미지도 이 길이에 포함됩니다.
  max_num_seqs: 4       # GPU에서 동시에 처리할 문제 수의 상한. 메모리가 부족하면 먼저 낮춰 보세요.
  enable_sleep_mode: false    # 모델을 잠시 내려두는 기능의 허용 여부. 현재 실행에서는 false로 두세요.
  enable_prefix_caching: true # 여러 문제의 앞부분이 같으면 계산을 재사용합니다. true로 두세요.
  limit_mm_per_prompt:
    image: 8           # 문제 하나에 허용할 이미지 수의 상한. 이미지를 8장 생성한다는 뜻은 아닙니다.

# 모델이 답변을 쓰는 방식을 정합니다. 비교 실험에서는 한 항목씩 바꿔 보세요.
sampling:
  temperature: 0.7        # 낮추면 비슷한 답변을, 높이면 다양한 답변을 내는 경향이 있습니다.
  max_tokens: 8192        # 답변에 허용할 최대 토큰 수. 너무 작으면 풀이가 중간에 끊깁니다.
  # max_model_len 안에 입력과 답변이 모두 들어가야 하므로, 항상 8192토큰을 쓸 수 있는 것은 아닙니다.
  seed: 42               # 무작위 선택의 기준 번호. 같은 번호여도 결과가 항상 같지는 않습니다.
  n: 1                   # 문제당 답변 수. 현재 실행 코드는 1만 지원하므로 바꾸지 마세요.
  top_p: 0.8             # 가능성이 높은 후보부터 확률을 더해 80%가 되는 범위에서 다음 토큰을 고릅니다.
  top_k: 20              # 다음 토큰 후보를 가능성이 높은 20개로 좁힙니다. top_p 조건도 함께 적용됩니다.
  repetition_penalty: 1.0 # 1이면 반복 억제를 추가하지 않습니다. 1보다 높이면 반복을 줄이는 쪽으로 조절합니다.
  presence_penalty: 1.5   # 양수이면 이미 나온 토큰을 다시 고를 가능성을 낮춥니다. 높다고 정답률이 높아지지는 않습니다.
