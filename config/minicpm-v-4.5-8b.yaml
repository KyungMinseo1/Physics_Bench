# Official model card: https://huggingface.co/openbmb/MiniCPM-V-4_5
# Sampling source (model.chat, sampling=True, enable_thinking=False):
# https://huggingface.co/openbmb/MiniCPM-V-4_5/blob/main/modeling_minicpmv.py
# Defaults: temperature=0.7, top_p=0.8, top_k=100, repetition_penalty=1.03.
# These are official implementation defaults, not a task-validated optimum.
# Model card lists vLLM support since v0.10.2; use a compatible release.
# max_tokens/context/GPU settings below are project budgets. Set assigned gpu_ids.
provider: vllm
model_path: openbmb/MiniCPM-V-4_5
vllm:
  gpus_per_instance: 1
  n_instances: 1
  gpu_ids:
  - 0
  gpu_memory_utilization: 0.8
  max_model_len: 12000
  max_num_seqs: 1
  enable_sleep_mode: false
  enable_prefix_caching: true
  limit_mm_per_prompt:
    image: 8
  enable_thinking: false
sampling:
  temperature: 0.7
  max_tokens: 4096
  seed: 42
  n: 1
  top_p: 0.8
  top_k: 100
  repetition_penalty: 1.03
